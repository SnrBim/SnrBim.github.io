<style>
  body.not-found-page #back-to-top {
    display: none;
  }
</style>

<main>
  <h1 id="not-found-title">404 - Page not found</h1>
  <p id="not-found-message">We do not have a page for <code id="not-found-slug"></code> yet.</p>
  <p id="not-found-contact">Please email
    <a id="developer-email" href="#">the developer</a><span id="not-found-contact-tail"> to request its publication.</span>
  </p>
  <p><a id="not-found-home" href="/">Back to documentation home</a></p>
</main>

<script>
  document.body.classList.add('not-found-page');

  const emailUser = 'simon.grodnik';
  const emailDomain = 'mobility.sener';
  const developerEmail = `${emailUser}@${emailDomain}`;
  const emailLink = document.getElementById('developer-email');
  emailLink.href = `mail${'to'}:${developerEmail}`;
  emailLink.textContent = developerEmail;

  const isSpanish = window.location.pathname === '/es' ||
                    window.location.pathname.startsWith('/es/');
  const pathParts = window.location.pathname.split('/').filter(Boolean);
  const pathWithoutLanguage = isSpanish ? pathParts.slice(1) : pathParts;
  const requestedSlug = pathWithoutLanguage[pathWithoutLanguage.length - 1] || '';
  document.getElementById('not-found-slug').textContent = decodeURIComponent(requestedSlug);

  if (isSpanish) {
    document.documentElement.lang = 'es';
    document.getElementById('not-found-title').textContent = '404 - Página no encontrada';
    document.getElementById('not-found-message').firstChild.textContent =
      'Aún no tenemos una página para ';
    document.getElementById('not-found-message').lastChild.textContent =
      ' todavía.';
    document.getElementById('not-found-contact').firstChild.textContent =
      'Escriba al desarrollador: ';
    document.getElementById('not-found-contact-tail').textContent =
      ' para solicitar su publicación.';
    document.getElementById('not-found-home').textContent = 'Volver a la documentación';
    document.getElementById('not-found-home').href = '/es/';
  }
</script>
